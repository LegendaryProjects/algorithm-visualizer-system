services:
  server:
    build: ./server
    container_name: algoviz-server
    ports:
      - "5555:5555"
    env_file:
      - ./server/.env
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        - VITE_API_BASE_URL=/api
    container_name: algoviz-client
    ports:
      - "80:80"
      - "5173:80"
    restart: unless-stopped
